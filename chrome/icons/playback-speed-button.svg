<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="context-fill #5b5b66" fill-opacity="context-fill-opacity">
<style>
<![CDATA[
  :root {
    color: #5b5b66;
    fill: context-fill #5b5b66;
  }
  path:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
  circle:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
  rect:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
  polygon:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]) {
    fill: context-fill #5b5b66;
  }
  :root[stroke],
  path[stroke]:not([stroke*="#"]):not([stroke="none"]),
  circle[stroke]:not([stroke*="#"]):not([stroke="none"]),
  rect[stroke]:not([stroke*="#"]):not([stroke="none"]) {
    stroke: context-stroke #5b5b66;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color: #fbfbfe;
      fill: context-fill #fbfbfe;
    }
    path:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
    circle:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
    rect:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]),
    polygon:not([fill*="#"]):not([fill*="rgb"]):not([fill="none"]) {
      fill: context-fill #fbfbfe;
    }
    :root[stroke],
    path[stroke]:not([stroke*="#"]):not([stroke="none"]),
    circle[stroke]:not([stroke*="#"]):not([stroke="none"]),
    rect[stroke]:not([stroke*="#"]):not([stroke="none"]) {
      stroke: context-stroke #fbfbfe;
    }
  }
]]>
</style>

